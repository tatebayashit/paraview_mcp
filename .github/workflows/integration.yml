name: integration

# Separate from unit.yml on purpose (docs/M2_PLAN.md CI-01): this job
# installs a full ParaView from conda-forge and runs allow-failure while
# it's new (CI-03), so its flakiness must never affect unit.yml's signal.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true  # CI-03: allow-failure until docs/M2_PLAN.md's exit criteria are met
    timeout-minutes: 20      # CI-04: don't let a hang eat the runner queue
    steps:
      - uses: actions/checkout@v4

      - name: Install ParaView via micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: latest
          environment-name: paraview-mcp-integration
          create-args: >-
            python=3.12
            paraview=6.1.1
            hdf5=1.14.6
          # hdf5 pin (2026-08-23): vtk-base 9.6.2 build 7 gained an hdf5 2.2
          # variant, but paraview 6.1.1 _2 was built against hdf5 1.14 and
          # doesn't pin it, so an unpinned solve breaks pvpython
          # (libhdf5.so.310 missing). Drop once paraview is rebuilt on hdf5 2.x.
          cache-environment: true  # CI-04: cache across runs

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install paraview-mcp (uv-managed venv, separate from the micromamba paraview env)
        run: uv sync --extra dev

      - name: Install Xvfb
        # GH Actions runners have no X server and no GPU; ParaView's
        # off-screen EGL/Mesa fallback crashes the pvpython process
        # outright when it tries to render (get_screenshot), taking the
        # whole standalone bridge down with it. A virtual X server via
        # GLX is the well-established fix for headless VTK/ParaView CI.
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run integration tests
        shell: micromamba-shell {0}
        run: |
          export PARAVIEW_MCP_PVPYTHON="$(which pvpython)"
          xvfb-run -a uv run pytest tests/integration -v
